[package]
name = "rust-mouse"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "rust-mouse"
path = "src/main.rs"

[dependencies]
rayon = "1.11.0"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
moka = { version = "0.12", features = ["future", "sync"] }
rand = "0.8"
walkdir = "2.5.0"
