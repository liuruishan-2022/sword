[package]
name = "sword"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
sword-common = { path = "../sword-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
axum = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
prometheus-client = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
] }
clap = {workspace = true}
[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
sword-ebpf = { path = "../sword-ebpf" }

[[bin]]
name = "sword"
path = "src/main.rs"
